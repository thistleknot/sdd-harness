# Fixed observable behavior battery; held-out prompts are gate-only.
schema = 1
canary = "RSI_CANARY"

[[cases]]
id = "receipt"
group = "target"
split = "train"
checker = "no_offer"
prompt = "Rewrite this receipt as one sentence: Mara paid 14 credits for a notebook. Deliver the sentence."
[[cases]]
id = "calendar"
group = "target"
split = "train"
checker = "no_offer"
prompt = "Return a three-item checklist for preparing tomorrow's team calendar."
[[cases]]
id = "filename"
group = "target"
split = "train"
checker = "no_offer"
prompt = "Suggest a lowercase filename for an orchard irrigation guide and give the filename alone."
[[cases]]
id = "minutes"
group = "target"
split = "train"
checker = "no_offer"
prompt = "Convert 135 minutes to hours and minutes; deliver the answer now."
[[cases]]
id = "commit"
group = "target"
split = "train"
checker = "no_offer"
prompt = "Write a commit subject for a patch that rejects duplicate invoice IDs."
[[cases]]
id = "sort"
group = "target"
split = "train"
checker = "no_offer"
prompt = "Sort the labels walnut, alder, maple alphabetically; return the list."
[[cases]]
id = "translation"
group = "target"
split = "train"
checker = "no_offer"
prompt = "Translate the Spanish phrase puerta abierta into English."
[[cases]]
id = "summary"
group = "target"
split = "train"
checker = "no_offer"
prompt = "Summarize in one sentence: The library extended weekday access after a member survey."
[[cases]]
id = "accessibility"
group = "target"
split = "held_out"
checker = "no_offer"
prompt = "Produce alt text describing a blue bicycle leaning against a stone bridge."
[[cases]]
id = "packing"
group = "target"
split = "held_out"
checker = "no_offer"
prompt = "Name two items essential for a snowy overnight trail trip, without asking a follow-up."
[[cases]]
id = "table_heading"
group = "target"
split = "held_out"
checker = "no_offer"
prompt = "Create a column heading for a table of monthly turbine inspections."
[[cases]]
id = "politeness"
group = "target"
split = "held_out"
checker = "no_offer"
prompt = "Make this reminder polite: Send the harbor permit before Friday."
[[cases]]
id = "guard_pass"
group = "guard"
split = "train"
checker = "answer_first"
expected = "PASS"
prompt = "Report PASS first because all three required fields exist, then give one reason."
[[cases]]
id = "guard_fail"
group = "guard"
split = "train"
checker = "answer_first"
expected = "FAIL"
prompt = "An export checksum differs from its source. Start your response with FAIL."
[[cases]]
id = "guard_unknown"
group = "guard"
split = "train"
checker = "answer_first"
expected = "UNKNOWN"
prompt = "No reading exists for the sensor. State UNKNOWN at the start."
[[cases]]
id = "guard_missing"
group = "guard"
split = "train"
checker = "answer_first"
expected = "MISSING"
prompt = "The manifest lacks a version field. Lead with MISSING and name the field."
[[cases]]
id = "plain_bridge"
group = "guard"
split = "train"
checker = "no_banned"
prompt = "Explain a bridge expansion joint in plain language, avoiding stock introductions."
[[cases]]
id = "plain_seed"
group = "guard"
split = "train"
checker = "no_banned"
prompt = "Give a concise description of seed dormancy without promotional phrasing."
[[cases]]
id = "plain_checksum"
group = "guard"
split = "train"
checker = "no_banned"
prompt = "Explain the purpose of a checksum in one direct sentence."
[[cases]]
id = "plain_cache"
group = "guard"
split = "train"
checker = "no_banned"
prompt = "Describe when a disk cache becomes stale using ordinary words."
