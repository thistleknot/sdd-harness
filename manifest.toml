# manifest.toml — capability matrix as data.
#
# A recorded decision table, not code: no installer reads the cells (setup.py reads only
# [runtime]). The agents rows are the exception that is guarded: specs/test_manifest_agents.py
# compares them with render_agents.py. Every (artifact x harness) cell carries exactly one strategy:
#
#   LINK     formats are byte-identical -> directory junction / symlink.
#            Zero drift by construction; live edits propagate both ways.
#   GENERATE formats genuinely differ -> emit native form from canonical source.
#            Copies drift, so generation must be idempotent and re-runnable.
#   SKIP     capability absent in this harness. Must carry a `reason`.
#            An explicit recorded decision, never an oversight.
#
# Rationale for each cell lives in inspirations.md.

schema = 1
canonical_root = "C:/Users/user/.harness"

# ---------------------------------------------------------------- runtime
# The pinned interpreter is 3.10, which predates tomllib (stdlib at 3.11+).
# tomli 2.2.1 is installed there, so install.py uses:
#     try: import tomllib
#     except ModuleNotFoundError: import tomli as tomllib
# Works unchanged on 3.10 -> 3.14. Do NOT force a Python upgrade for this;
# the adapters' spawn path is pinned to py310 and moving it is a separate change.
[runtime]
python   = "C:/Users/user/py310/Scripts/python.exe"
version  = "3.10.0"
toml_lib = "tomli"                # stdlib tomllib once the pin moves to >=3.11
available = ["3.10.0", "3.11.9", "3.12.0", "3.14"]

# MCP servers have isolated projects and environments on F:; ordinary harness
# hooks and non-MCP tools continue to use the general runtime above.
[runtime.mcp]
python          = "C:/Users/user/AppData/Roaming/uv/python/cpython-3.12.9-windows-x86_64-none/python.exe"
version         = "3.12.9"
environments_dir = "F:/Python/mcp"
cache_dir       = "F:/Python/uv-cache"
tool_dir        = "F:/Python/uv-tools"

[runtime.mcp.projects]
retrieve-skills      = "mcp/retrieve-skills"
memory-index         = "mcp/memory-index"
todo                 = "mcp/todo"
specs                = "mcp/specs"
data-science-skills  = "mcp/data-science-skills"
agentic-kanban       = "mcp/agentic-kanban"

[runtime.mcp.tools]
graphify = "graphifyy[mcp]==0.9.93"

# ---------------------------------------------------------------- harnesses

[harness.claude]
name       = "Claude Code"
root       = "C:/Users/user/.claude"
detect     = "settings.json"
can_gate   = true
gate_style = "hook-json"          # stdout JSON, permissionDecision:deny, exit 0
gate_wire  = "settings.json"      # declarative: matcher regex in config
notes      = "B1: matcher currently omits Bash/PowerShell -> shell gating dead. Fixed in Phase 2."

[harness.pi]
name       = "pi"
root       = "C:/Users/user/.pi"
detect     = "agent/settings.json"
can_gate   = true
gate_style = "ext-return"         # return {block:true, reason}
gate_wire  = "presence"           # dropping the dir is sufficient; no allowlist
notes      = "Most complete gate today (shell + delegation). No native always-on instruction slot."

[harness.opencode]
name       = "opencode"
root       = "C:/Users/user/.config/opencode"
detect     = "opencode.json"
config_fmt = "jsonc"              # contains real // comments; strict JSON parsers fail
can_gate   = true
gate_style = "plugin-throw"       # any thrown Error aborts the call
gate_wire  = "plugin"
notes      = "B2: tool.execute.before cannot intercept subagent calls (opencode#5894)."

[harness.kiro]
name       = "Kiro"
root       = "C:/Users/user/.kiro"
detect     = "steering"
can_gate   = false                # <-- no interception point of any kind exists
gate_style = "none"
notes      = "Design source only. Receives unenforced instructions + MCP config as a courtesy."

[harness.codex]
name       = "Codex CLI"
root       = "C:/Users/user/.codex"
detect     = "config.toml"
can_gate   = false                # Advisory until a policy-deny hook is verified end to end.
gate_style = "none"
gate_wire  = "hooks.json"
notes      = "MCP and prompt hooks are projected; this matrix does not claim write-deny enforcement."

[harness.gemini]
name       = "Gemini CLI"
root       = "C:/Users/user/.gemini"
detect     = "GEMINI.md"
can_gate   = false
gate_style = "none"
gate_wire  = "none"
notes      = "Instruction document is generated; enforcement is unverified."

[harness.hermes]
name       = "Hermes Agent"
root       = "C:/Users/user/AppData/Local/hermes"
detect     = "SOUL.md"
can_gate   = false
gate_style = "none"
gate_wire  = "none"
notes      = "Instruction document is generated; enforcement is unverified."

[harness.copilot]
name = "GitHub Copilot CLI"
root = "C:/Users/user/.copilot"
detect = "mcp-config.json"
can_gate = false
gate_style = "none"
notes = "User-level MCP projection is implemented; enforcement is not claimed."

[harness.vscode]
name = "VS Code"
root = "C:/Users/user/AppData/Roaming/Code/User"
detect = "mcp.json"
can_gate = false
gate_style = "none"
notes = "Native user MCP projection is implemented; enforcement is not claimed."

