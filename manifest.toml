# ---------------------------------------------------------------- agents

# Every agents row below is GENERATE, produced by render_agents.py from tiers.toml (roles,
# provider bindings, harness table). specs/test_manifest_agents.py fails if these rows and the
# renderers disagree. `target` is the primary path written; --apply backs up first, and
# nothing is written without it. "UNVERIFIED" here means no live probe is recorded yet in
# tiers.toml [harness.*].verified.

[[cell]]
artifact = "agents"
harness  = "claude"
strategy = "GENERATE"
target   = "C:/Users/user/.harness/claude/agents"
emit     = "agents/*.md (frontmatter generated, body verbatim); sync-to-claude.ps1 copies them to ~/.claude/agents"
note     = "Was recorded as LINK, but the live tree is a file copy, so the cell was wrong. Byte-exact CRLF identity is proven by --check."

[[cell]]
artifact = "agents"
harness  = "codex"
strategy = "GENERATE"
target   = "C:/Users/user/.skills/codex-agents"
emit     = "<role>-<provider>.toml per agent, plus [profiles.party_*] in ~/.codex/config.toml between marker comments"
note     = "Probed 2026-10-08. Profiles load: `codex exec -p party_oracle_openai` sends model=gpt-6.1-sol while a plain run sends gpt-5.4. But the localhost:4000 proxy answers 'Invalid model name passed in model=gpt-5.4' and fails Codex's /responses path for Ollama models (the operator's own [profiles.local] fails identically), so no template is verified end to end: UNVERIFIED. Whether Codex loads codex-agents/*.toml itself is also UNVERIFIED. Templates: openai, ollama."

[[cell]]
artifact = "agents"
harness  = "opencode"
strategy = "GENERATE"
target   = "C:/Users/user/.config/opencode/agents"
emit     = "<role>-<provider>.md (model, mode, permission map) plus reasoning variants merged into opencode.json"
note     = "Never touches oh-my-opencode-slim.json. Templates: openrouter, ollama. Effort is a model variant for openrouter (openai/* takes flat reasoningEffort, other vendors the nested reasoning object) and advisory for ollama. Verified 2026-10-08 with `opencode debug agent` AND `opencode run`: PONG from openrouter haiku-5.5 (low), sonnet-5.5 (low), gpt-5.6-sol (high) and from ollama qwopus 9b (6m40s cold)."

[[cell]]
artifact = "agents"
harness  = "pi"
strategy = "GENERATE"
target   = "C:/Users/user/.pi/agent/agents"
emit     = "<role>-<provider>.md read by pi-subagents (model, thinking, tools allowlist)"
note     = "Was recorded as SKIP with a stale reason: the directory exists. Refuses a model that is not in pi's models.json. Templates: ollama, openrouter. Probed 2026-10-08: pi starts clean with the generated files present and answers (4m20s on the 2b model), but a subagent dispatch was not exercised: UNVERIFIED. The openrouter template stays unrendered until providers.openrouter (with the operator's own key) exists in models.json; the secret guard will not write a key."

[[cell]]
