[project]
name = "harness-mcp-data-science-skills"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==2.14.2",
    "langchain-ollama==1.0.1",
    "langchain-postgres==0.0.19",
    "neo4j==4.4.13",
    "numpy==1.26.4",
    "psycopg[binary]==3.2.7",
    "requests==2.32.5",
    "torch>=2.6,<3",
    "transformers==5.19.0",
]

[tool.uv]
package = false
link-mode = "hardlink"
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
constraint-dependencies = ["fakeredis==2.37.1", "pydocket==0.16.3", "redis==5.2.1"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
