[project]
name = "harness-mcp-retrieve-skills"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==2.14.2",
    "numpy==2.2.6",
    "pyyaml==6.0.3",
    "sentence-transformers==5.3.0",
    "starlette>=0.40,<1",
    "torch>=2.6,<3",
]

[tool.uv]
package = false
link-mode = "hardlink"
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
constraint-dependencies = ["fakeredis==2.37.1", "pydocket==0.16.3", "redis==5.2.1"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
